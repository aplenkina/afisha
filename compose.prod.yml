name: afisha-prod

services:
  app:
    image: afisha-php:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      DEFAULT_URI: ${PUBLIC_URL:?Set PUBLIC_URL}
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AFISHA_MONITOR_REPORT_TOKEN: ${AFISHA_MONITOR_REPORT_TOKEN:-}
      GTM_CONTAINER_ID: ${GTM_CONTAINER_ID-GTM-WDZ888B5}
      GTM_EXTRA_CONTAINER_ID: ${GTM_EXTRA_CONTAINER_ID-GTM-KQTDN7CC}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_logs:/var/www/html/app/var/log
    restart: unless-stopped

  app-go:
    image: afisha-collector:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      COLLECT_AT: ${COLLECT_AT:-04:00}
      COLLECTOR_LOG_PATH: /var/log/afisha/collector.log
    volumes:
      - app_logs:/var/log/afisha
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  app_logs:
