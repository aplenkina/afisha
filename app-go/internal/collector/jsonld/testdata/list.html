й фонд мира вручил ему медаль «Заслуженный миротворец» за многолетнюю миротворческую деятельность. Его миротворческая деятельность включает содействие диалогу между сторонами конфликтов, гуманитарную помощь и программы поддержки людей, пострадавших от насилия и войн.29 октября Гурудев будет здесь, в Минске, — для живого разговора с вами.Партнёры и поддержкаГурудев Шри Шри Рави Шанкар приезжает в Беларусь по приглашению ОО «Белорусский фонд мира» для участия в мероприятиях, посвящённых 65-летию организации 30 октября 2026 года.Мероприятие «Искусство жить в мире» проводится при участии Государственного учреждения «Заслуженный коллектив Республики Беларусь «Музыкальная капелла «СОНОРУС» Минской области».Организатор мероприятия: ООО «Вышиванка».Мероприятие проводится по инициативе и при поддержке УП “Искусство жизни”. Выберите своё место — и встретимся 29 октября!Дата: 29 октября 2026 годаНачало: 19:00Место: «Чижовка-Арена», Минск, ул. Ташкентская, 19Язык встречи: английский с последовательным переводом на русский язык.Для участия в медитации не требуется предварительная подготовка или специальный опыт.Приезжаете из другой страны?Планируете поездку? Информацию о проживании, поездке и контакты координаторов вы найдёте на сайте. Будем рады встретить вас в Минске!До встречи 29 октября!Продолжительность: ориентировочно 2,5 часаВозрастное ограничение: 18+Возврат билетов по инициативе покупателей на данное мероприятие осуществляется до 27 октября 2026 включительно. Инфолиния по возврату билетов: +375 29 693-59-35 (ежедневно с 9.00 до 20.00).	Билеты, купленные онлайн на сайте ticketpro.by, можно вернуть, обратившись на эл. почту help@ticketpro.by. В теме письма нужно написать «Возврат» и прикрепить билеты (PDF-файл/скриншот) к письму. Прием заявок на возврат билетов осуществляется ежедневно с 09.00 до 20.00.	Билеты, купленные в любой из касс-партнеров можно вернуть в фирменной кассе Ticketpro.by по адресу: г. Минск, пр-т Машерова 25, 1 этаж, офис 128 (вход напротив магазина &q
